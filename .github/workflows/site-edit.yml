# Modifiche al sito chieste dalla super chat (/admin/assistant).
# La super chat invia un repository_dispatch "site-edit": Claude Code modifica il
# codice su un ramo site-edit/<id>, apre una pull request (Vercel ne crea
# l'anteprima) e avvisa il sito. Va online solo quando Luca preme "Pubblica".
name: Modifica sito (super chat)
run-name: "site-edit ${{ github.event.client_payload.id }}"

on:
  repository_dispatch:
    types: [site-edit]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: site-edit-${{ github.event.client_payload.id }}

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDIT_ID: ${{ github.event.client_payload.id }}
      BRANCH: site-edit/${{ github.event.client_payload.id }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.facevoice.ai' }}
    steps:
      - name: Controlla id
        run: '[[ "$EDIT_ID" =~ ^[a-z0-9]{6,32}$ ]] || { echo "id non valido"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ramo della modifica
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout -b "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main || git merge --abort
          else
            git checkout -b "$BRANCH"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ github.event.client_payload.model == 'opus' && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm exec tsc:*),Bash(npx tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*)"
          prompt: |
            Sei lo sviluppatore del sito Facevoice AI (Next.js App Router, Tailwind, Supabase), in questo repository.
            Luca, il titolare, ti chiede dalla super chat del pannello admin:

            <richiesta>
            ${{ github.event.client_payload.request }}
            </richiesta>

            Come lavorare:
            - Leggi il codice che serve, poi fai la modifica più piccola e pulita che soddisfa la richiesta, nello stile del codice intorno.
            - Alla fine esegui `pnpm exec tsc --noEmit -p .` e correggi gli errori.
            - NON fare commit, push o pull request: ci pensa il flusso automatico dopo di te.
            - Se la richiesta è solo una domanda sul sito o sul codice, non modificare nulla e rispondi nel riepilogo.
            - Se la richiesta è ambigua o rischiosa (cancellare dati, toccare login, pagamenti, chiavi o permessi), non modificare nulla e spiega nel riepilogo cosa ti serve sapere.

            Regole del sito da rispettare sempre:
            - Mai scrivere chiavi, token o password nel codice: vanno solo nelle variabili d'ambiente di Vercel.
            - Per gli admin usa isAdminEmail / ADMIN_EMAILS, mai email scritte nel codice.
            - Sul sito pubblico non dire mai che il team lavora in smart working. Indirizzo ufficiale: VIA VITO DI STEFANO N 32, Terrasini.
            - Il sito è tradotto in automatico (AutoTranslate): scrivi i testi in italiano come gli altri.
            - Non copiare contenuti di altre agenzie.

            Come ultima cosa scrivi il file SITE_EDIT_SUMMARY.md nella radice del repository: un riepilogo per Luca in italiano semplice
            (niente gergo tecnico, niente markdown pesante, massimo 8 righe) di cosa hai cambiato e dove si vede sul sito,
            oppure la risposta alla sua domanda, oppure cosa ti serve sapere.

      - name: Commit e pull request
        id: pr
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ github.event.client_payload.request }}
        run: |
          if [ -f SITE_EDIT_SUMMARY.md ]; then mv SITE_EDIT_SUMMARY.md "$RUNNER_TEMP/summary.md"; else echo "Lavoro terminato senza riepilogo." > "$RUNNER_TEMP/summary.md"; fi
          TITLE="Super chat: $(echo "$REQUEST" | tr '\n' ' ' | cut -c1-70)"
          git add -A
          git diff --cached --quiet || git commit -q -m "$TITLE"
          if git rev-parse -q --verify "origin/$BRANCH" >/dev/null; then BASE="origin/$BRANCH"; else BASE="origin/main"; fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$BASE")" ] && [ "$BASE" = "origin/main" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -q -u origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            { cat "$RUNNER_TEMP/summary.md"; printf '\n\n---\nRichiesta di Luca dalla super chat:\n> %s\n' "$REQUEST"; } > "$RUNNER_TEMP/body.md"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/summary.md" >/dev/null
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Avvisa il sito
        if: always()
        env:
          KEY: ${{ secrets.SITE_EDIT_KEY }}
          CONCLUSION: ${{ job.status }}
          PR: ${{ steps.pr.outputs.pr }}
          CHANGED: ${{ steps.pr.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$KEY" ] || { echo "SITE_EDIT_KEY non impostata: il sito leggerà lo stato da GitHub"; exit 0; }
          SUMMARY="$(cat "$RUNNER_TEMP/summary.md" 2>/dev/null || true)"
          jq -n --arg id "$EDIT_ID" --arg conclusion "$CONCLUSION" --arg pr "$PR" --arg changed "$CHANGED" --arg summary "$SUMMARY" --arg runUrl "$RUN_URL" \
            '{id:$id, conclusion:$conclusion, pr:($pr|tonumber? // null), changed:($changed=="true"), summary:$summary, runUrl:$runUrl}' \
          | curl -sS -X POST "$SITE_URL/api/admin/site-edits" -H "Content-Type: application/json" -H "x-internal-key: $KEY" --data-binary @- || true
